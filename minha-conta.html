<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Área do Participante</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <button id="botao-menu">☰</button>

      <button id="botao-tema">🌙</button>

      <div class="logo">Semana <span>Tech</span> 2026</div>

      <nav id="menu">
        <a href="index.html">Início</a>
        <a href="index.html">Oficinas</a>
        <a href="inscricoes.html">Minhas inscrições</a>
        <a href="minha-conta.html">Minha Conta</a>
      </nav>
    </header>
    <main class="minha-conta">
      <h1>Área do Participante</h1>

      <form id="formulario-conta">
        <label for="nome">Nome completo:</label>
        <input type="text" id="nome" name="nome" />
        <p id="mensagem-nome"></p>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" />
        <p id="mensagem-email"></p>

        <label for="idade">Idade:</label>
        <input type="number" id="idade" name="idade" />

        <label for="cidade">Cidade:</label>
        <input type="text" id="cidade" name="cidade" />

        <label for="senha">Senha:</label>
        <div class="campo-senha">
          <input type="password" id="senha" name="senha" />
          <button type="button" id="mostrar-senha">Mostrar</button>
        </div>

        <button type="submit">Salvar dados</button>
      </form>

      <p id="mensagem-sucesso"></p>

      <section id="meu-perfil">
        <h2>Meu perfil</h2>
      </section>
      <div class="area-perfil">
        <img
          id="imagem-perfil"
          src="https://w7.pngwing.com/pngs/798/436/png-transparent-computer-icons-user-profile-avatar-profile-heroes-black-profile-thumbnail.png"
          alt="Imagem de perfil"
        />

        <div class="opcoes-avatar">
          <img src="https://icon2.cleanpng.com/20180423/zqw/avte45a4l.webp" alt="Avatar 1" class="miniatura" />
          <img src="https://w7.pngwing.com/pngs/306/225/png-transparent-account-avatar-profile-user-avatars-icon.png" alt="Avatar 2" class="miniatura" />
          <img src="https://w7.pngwing.com/pngs/364/361/png-transparent-account-avatar-profile-user-avatars-icon-thumbnail.png" alt="Avatar 3" class="miniatura" />
          <img src="https://w7.pngwing.com/pngs/122/453/png-transparent-computer-icons-user-profile-avatar-female-profile-heroes-head-woman-thumbnail.png" alt="Avatar 4" class="miniatura" />
        </div>
      </div>
    </main>
    <script src="minha-conta.js"></script>
  </body>
</html>
